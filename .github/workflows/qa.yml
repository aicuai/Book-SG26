name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 09:00 UTC (= 月曜 18:00 JST)
    - cron: '0 9 * * 1'
  workflow_dispatch:

# 既定は読み取りのみ。issues:write は report-failure ジョブにだけ与える。
# validate-json / check-shortlinks は PR ブランチのスクリプトを実行するため、
# それらのジョブに書き込み権限を持たせない。
permissions:
  contents: read

# 同じブランチへの連続 push で古い実行を積まない（runner の節約）
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    name: Validate notebook & workflow JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate all .ipynb and .json files
        id: run
        run: python qa/check_json.py

  check-shortlinks:
    name: Check j.aicu.ai shortlinks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve and check shortlinks
        id: run
        run: python qa/check_shortlinks.py

  report-failure:
    name: Report failures via issue
    needs: [validate-json, check-shortlinks]
    # PR の失敗は PR 上のチェックで分かる。Issue を立てるのは main への push と
    # 定期実行のときだけにする（Issue #2 は PR の失敗から立っていた）。
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = [];
            if (${{ needs.validate-json.result == 'failure' }}) failed.push('validate-json');
            if (${{ needs.check-shortlinks.result == 'failure' }}) failed.push('check-shortlinks');

            const title = `[QA] ${failed.join(', ') || 'unknown'} failed`;
            const body = [
              `自動 QA で失敗を検出しました。`,
              ``,
              `- 失敗したジョブ: \`${failed.join('`, `') || '(none)'}\``,
              `- 実行: ${runUrl}`,
              `- トリガ: \`${context.eventName}\` / ブランチ: \`${context.ref}\``,
              ``,
              `> このIssueは GitHub Actions により自動生成されました。`,
              `> 詳細解析と対応は開発リポジトリ側で実施されます。`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'qa-failure',
              per_page: 10,
            });

            if (existing.length === 0) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['qa-failure'],
              });
              core.info(`Created issue #${created.data.number}`);
            } else {
              const target = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body,
              });
              core.info(`Commented on existing issue #${target.number}`);
            }
