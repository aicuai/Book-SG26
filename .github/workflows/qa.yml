name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 09:00 UTC (= 月曜 18:00 JST)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate-json:
    name: Validate notebook & workflow JSON
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all .ipynb and .json files
        id: run
        run: python qa/check_json.py

  check-shortlinks:
    name: Check j.aicu.ai shortlinks
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve and check shortlinks
        id: run
        run: python qa/check_shortlinks.py

  report-failure:
    name: Report failures via issue
    needs: [validate-json, check-shortlinks]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = [];
            if (${{ needs.validate-json.result == 'failure' }}) failed.push('validate-json');
            if (${{ needs.check-shortlinks.result == 'failure' }}) failed.push('check-shortlinks');

            const title = `[QA] ${failed.join(', ') || 'unknown'} failed`;
            const body = [
              `自動 QA で失敗を検出しました。`,
              ``,
              `- 失敗したジョブ: \`${failed.join('`, `') || '(none)'}\``,
              `- 実行: ${runUrl}`,
              `- トリガ: \`${context.eventName}\` / ブランチ: \`${context.ref}\``,
              ``,
              `> このIssueは GitHub Actions により自動生成されました。`,
              `> 詳細解析と対応は開発リポジトリ側で実施されます。`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'qa-failure',
              per_page: 10,
            });

            if (existing.length === 0) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['qa-failure'],
              });
              core.info(`Created issue #${created.data.number}`);
            } else {
              const target = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body,
              });
              core.info(`Commented on existing issue #${target.number}`);
            }
